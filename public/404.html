<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Vidura Gam Hewage</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070B1F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* this page has to work from any address on the site, so it carries its own styles and
         uses the same colours as the main page without loading anything from it */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: radial-gradient(ellipse at 70% 12%, #1a2468 0%, #0a0f2e 48%, #070b1f 100%);
        color: #f3e9d2;
        font:
          17px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        overflow-x: hidden;
      }
      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
          radial-gradient(1px 1px at 28% 62%, #cfe4ff, transparent),
          radial-gradient(1.5px 1.5px at 44% 9%, #fff, transparent),
          radial-gradient(1px 1px at 63% 31%, #ffd9a0, transparent),
          radial-gradient(1.5px 1.5px at 81% 14%, #fff, transparent),
          radial-gradient(1px 1px at 90% 70%, #cfe4ff, transparent),
          radial-gradient(1px 1px at 7% 84%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 55% 78%, #ffd9a0, transparent);
        animation: twinkle 5s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      main {
        position: relative;
        max-width: 520px;
      }
      .moon {
        width: 64px;
        height: 64px;
        margin: 0 auto 8px;
      }
      .code {
        font:
          500 13px/1 ui-monospace,
          'DM Mono',
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.18em;
        color: #8fdcff;
      }
      h1 {
        margin: 14px 0 0;
        font:
          500 clamp(38px, 8vw, 60px) / 1.05 'Fraunces',
          Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-weight: 400;
      }
      p {
        margin: 16px auto 0;
        max-width: 440px;
        color: #c9d0ea;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
        color: #f3e9d2;
        text-decoration: none;
        border: 1px solid rgba(243, 233, 210, 0.4);
        background: rgba(10, 13, 34, 0.6);
      }
      a.primary {
        border-color: transparent;
        background: #ffb547;
        color: #120f26;
        box-shadow: 0 16px 36px -14px rgba(255, 181, 71, 0.6);
      }
      a:focus-visible {
        outline: 2px solid #ffb547;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .stars {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main>
      <svg class="moon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M46 37.5A15.5 15.5 0 0 1 26.5 18 15.5 15.5 0 1 0 46 37.5Z" fill="#FFB547" />
        <circle cx="44" cy="17" r="2" fill="#F3E9D2" />
        <circle cx="51" cy="26" r="1.2" fill="#F3E9D2" />
      </svg>
      <div class="code">404 · NOT FOUND</div>
      <h1>That window <em>isn't lit</em> yet.</h1>
      <p>
        The page you were after has moved, or was never here. The rest of the valley is still
        glowing, so head back and have a look around.
      </p>
      <div class="buttons">
        <a class="primary" href="/">Back to the homepage</a>
        <a href="mailto:hello@viduvish.dev">Email me</a>
      </div>
    </main>
  </body>
</html>
