<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Vidura Gam Hewage</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070B1F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* standalone on purpose, this has to render from any url so it does not use the main css */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: radial-gradient(ellipse at 70% 12%, #1a2468 0%, #0a0f2e 48%, #070b1f 100%);
        color: #f3e9d2;
        font:
          17px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        overflow-x: hidden;
      }
      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
          radial-gradient(1px 1px at 28% 62%, #cfe4ff, transparent),
          radial-gradient(1.5px 1.5px at 44% 9%, #fff, transparent),
          radial-gradient(1px 1px at 63% 31%, #ffd9a0, transparent),
          radial-gradient(1.5px 1.5px at 81% 14%, #fff, transparent),
          radial-gradient(1px 1px at 90% 70%, #cfe4ff, transparent),
          radial-gradient(1px 1px at 7% 84%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 55% 78%, #ffd9a0, transparent);
        animation: twinkle 5s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      main {
        position: relative;
        max-width: 520px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
      }
      .code {
        font:
          500 13px/1 ui-monospace,
          'DM Mono',
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.18em;
        color: #8fdcff;
      }
      h1 {
        margin: 14px 0 0;
        font:
          500 clamp(38px, 8vw, 60px) / 1.05 'Fraunces',
          Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-weight: 400;
      }
      p {
        margin: 16px auto 0;
        max-width: 440px;
        color: #c9d0ea;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
        color: #f3e9d2;
        text-decoration: none;
        border: 1px solid rgba(243, 233, 210, 0.4);
        background: rgba(10, 13, 34, 0.6);
      }
      a.primary {
        border-color: transparent;
        background: #ffb547;
        color: #120f26;
        box-shadow: 0 16px 36px -14px rgba(255, 181, 71, 0.6);
      }
      a:focus-visible {
        outline: 2px solid #ffb547;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .stars {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main>
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path
          d="M3.4 13.2 6.6 3.4 13.6 8Q16 7.3 18.4 8L25.4 3.4 28.6 13.2Q30 16.5 30 20.4 30 28.8 16 28.8 2 28.8 2 20.4 2 16.5 3.4 13.2Z"
          fill="#ffb547"
          stroke="#ffb547"
          stroke-width="1.4"
          stroke-linejoin="round"
        />
        <path d="M6.9 9.2 7.3 6.4 10 8.1zM25.1 9.2 24.7 6.4 22 8.1z" fill="#ffe2a8" />
        <g stroke="#1a1740" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.4 15.4 11 23.4 14.6 15.4" />
          <path d="M24.9 17.4A4.4 4.4 0 1 0 25.3 20.2H21" />
        </g>
      </svg>
      <div class="code">404 · NOT FOUND</div>
      <h1>That window <em>isn't lit</em> yet.</h1>
      <p>
        That page has moved, or was never here. The rest of the valley is still lit, so head back
        and have a look around.
      </p>
      <div class="buttons">
        <a class="primary" href="/">Back to the homepage</a>
        <a href="mailto:hello@viduvish.dev">Email me</a>
      </div>
    </main>
  </body>
</html>
